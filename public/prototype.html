<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТРЁШКА склад</title>
<style>
  :root{
    --bg:#05070a; --panel:#1b1f27; --panel2:#12151b; --ink:#e8ebf0; --muted:#8a92a3;
    --accent:#4f8cff; --accent-soft:rgba(79,140,255,.16); --green:#34d399; --green-soft:rgba(52,211,153,.14);
    --red:#f87171; --red-soft:rgba(248,113,113,.14); --amber:#fbbf24; --amber-soft:rgba(251,191,36,.14);
    --line:#2a2f3a; --chip:#232733;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  body{background:#000; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px;}
  .phone{width:400px; max-width:100%; height:840px; background:var(--bg); border-radius:34px; box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 10px #000; overflow:hidden; display:flex; flex-direction:column; position:relative; color:var(--ink);}
  /* masthead */
  .mast{background:var(--panel2); padding:8px 16px 6px; display:flex; align-items:baseline; gap:6px; border-bottom:1px solid var(--line);}
  .mast b{font-size:13px; font-weight:800; letter-spacing:.04em; color:var(--accent);}
  .mast span{font-size:11px; color:var(--muted);}
  /* header */
  .hdr{background:var(--panel2); padding:12px 16px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; z-index:5;}
  .hdr .back{width:34px;height:34px;border-radius:10px;background:var(--chip);border:none;font-size:17px;color:var(--ink);cursor:pointer;flex:none;display:none;}
  .hdr .back.show{display:block;}
  .hdr h1{font-size:17px; font-weight:700; color:var(--ink); flex:1; line-height:1.2;}
  .hdr .sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;}
  .hdr .plus{width:34px;height:34px;border-radius:10px;background:var(--accent);border:none;font-size:19px;color:#fff;cursor:pointer;flex:none;}
  /* content */
  .content{flex:1; overflow-y:auto; padding:14px 14px 90px; background:var(--bg);}
  .content::-webkit-scrollbar{width:0;}
  /* bottom nav */
  .nav{position:absolute; bottom:0; left:0; right:0; background:var(--panel2); border-top:1px solid var(--line); display:flex; padding:8px 4px 14px; z-index:10;}
  .nav button{flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px; padding:4px 0;}
  .nav button .ic{font-size:19px; line-height:1;}
  .nav button.on{color:var(--accent); font-weight:600;}
  /* FAB */
  .fab{position:absolute; bottom:86px; right:16px; width:54px; height:54px; border-radius:17px; background:var(--accent); color:#fff; border:none; font-size:23px; cursor:pointer; box-shadow:0 8px 24px rgba(79,140,255,.4); z-index:9;}
  /* cards */
  .card{background:var(--panel); border-radius:15px; padding:13px; margin-bottom:9px; border:1px solid var(--line); cursor:pointer; transition:transform .08s;}
  .card:active{transform:scale(.985);}
  .card.static{cursor:default;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}
  .t{font-size:14px; font-weight:600; color:var(--ink);}
  .s{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .qty{font-size:15px; font-weight:700; color:var(--ink); text-align:right; white-space:nowrap;}
  .qty small{font-size:10.5px; color:var(--muted); font-weight:500;}
  .qty.low{color:var(--red);}
  .chip{display:inline-block; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:600; background:var(--chip); color:var(--muted);}
  .chip.green{background:var(--green-soft); color:var(--green);}
  .chip.red{background:var(--red-soft); color:var(--red);}
  .chip.amber{background:var(--amber-soft); color:var(--amber);}
  .chip.blue{background:var(--accent-soft); color:var(--accent);}
  .icbox{width:40px;height:40px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
  /* toolbar */
  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .search{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--ink); outline:none;}
  .search::placeholder{color:var(--muted);}
  select.sort{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:0 8px; font-size:12px; color:var(--ink); outline:none; max-width:130px;}
  .filters{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .fbtn{border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:6px 12px; font-size:11px; color:var(--muted); cursor:pointer; font-weight:600;}
  .fbtn.on{background:var(--ink); color:#111; border-color:var(--ink);}
  /* section title */
  .sec{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 2px 8px;}
  .sec:first-child{margin-top:2px;}
  /* item detail */
  .detail-top{background:var(--panel); border-radius:16px; border:1px solid var(--line); padding:16px; margin-bottom:10px; display:flex; gap:14px;}
  .qr-wrap{text-align:center; flex:none;}
  .qr-wrap img{border-radius:8px; border:1px solid var(--line); padding:5px; background:#fff;}
  .qr-wrap .s{margin-top:4px; font-size:10px;}
  .kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{color:var(--ink); font-weight:600; text-align:right;}
  /* timeline */
  .tl{position:relative; padding-left:18px;}
  .tl::before{content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .tl-item{position:relative; padding:0 0 14px;}
  .tl-item::before{content:''; position:absolute; left:-17px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--line);}
  .tl-item.in::before{background:var(--green);}
  .tl-item.out::before{background:var(--amber);}
  .tl-item.off::before{background:var(--red);}
  .tl-item .t{font-size:13px;}
  /* buttons */
  .btn{display:block; width:100%; padding:13px; border-radius:13px; border:none; font-size:14px; font-weight:700; cursor:pointer; text-align:center; margin-top:10px;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.primary:disabled{background:#334; color:#889; cursor:not-allowed;}
  .btn.ghost{background:var(--panel); color:var(--accent); border:1.5px solid var(--accent);}
  .btn.green{background:var(--green); color:#06231a;}
  .btn.red{background:var(--red); color:#2a0a0a;}
  .btn.red:disabled{background:#3a2a2a; color:#775; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{margin-top:10px;}
  /* forms */
  .fld{margin-bottom:11px;}
  .fld label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .fld label .req{color:var(--red);}
  .fld input,.fld select,.fld textarea{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:11px 12px; font-size:13.5px; color:var(--ink); outline:none;}
  .fld input::placeholder,.fld textarea::placeholder{color:#5b6270;}
  .fld input:focus,.fld textarea:focus{border-color:var(--accent);}
  .fld textarea{resize:none; height:64px;}
  .fld .hint{font-size:10.5px; color:var(--muted); margin-top:3px;}
  .fld.err input,.fld.err select,.fld.err textarea{border-color:var(--red);}
  .progress-note{background:var(--amber-soft); border-radius:11px; padding:10px 12px; font-size:12px; color:var(--amber); margin-bottom:12px; font-weight:600;}
  .progress-note.ok{background:var(--green-soft); color:var(--green);}
  .progress-note.bad{background:var(--red-soft); color:var(--red);}
  .notice-danger{display:flex; align-items:center; gap:10px; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.35); border-radius:13px; padding:12px; margin-bottom:12px; cursor:pointer;}
  .notice-danger .icbox{width:30px;height:30px;font-weight:800;font-size:16px;flex:none;}
  .scan-screen{position:absolute; inset:0; background:#000; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:18px;}
  .scan-screen .x{position:absolute; top:18px; right:18px; background:none; border:none; color:#fff; font-size:26px; cursor:pointer;}
  .scan-frame{width:220px; height:220px; position:relative;}
  .scan-frame i{position:absolute; width:38px; height:38px; border-color:var(--accent); display:block;}
  .scan-frame i:nth-child(1){left:0;top:0;border-left:3px solid;border-top:3px solid;border-radius:8px 0 0 0;}
  .scan-frame i:nth-child(2){right:0;top:0;border-right:3px solid;border-top:3px solid;border-radius:0 8px 0 0;}
  .scan-frame i:nth-child(3){left:0;bottom:0;border-left:3px solid;border-bottom:3px solid;border-radius:0 0 0 8px;}
  .scan-frame i:nth-child(4){right:0;bottom:0;border-right:3px solid;border-bottom:3px solid;border-radius:0 0 8px 0;}
  .scan-screen h2{color:#fff;font-size:15px;}
  .scan-screen p{color:var(--muted);font-size:12px;}
  .qty-picker{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .qty-picker select{flex:1;}
  .qty-picker input{width:80px;}
  .sel-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;}
  .sel-check.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .issue-bar{position:sticky; bottom:0; background:var(--panel2); border:1px solid var(--accent); border-radius:14px; margin-top:12px; padding:12px; display:flex; justify-content:space-between; align-items:center;}
  .issue-bar b{font-size:16px;color:var(--accent);margin-right:4px;}
  /* materials table */
  .mat{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .mat:last-child{border-bottom:none;}
  .mat .grow .t{font-size:13px;}
  .mat .q{font-weight:700; color:var(--ink); white-space:nowrap;}
  .mat .del{background:var(--red-soft); color:var(--red); border:none; width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:13px;}
  .addmat{display:flex; gap:6px; margin-top:10px;}
  .addmat select{flex:1;}
  .addmat input{width:70px;}
  .addmat button{background:var(--accent-soft); color:var(--accent); border:none; border-radius:11px; padding:0 14px; font-weight:700; cursor:pointer; font-size:18px;}
  /* toast */
  .toast{position:absolute; bottom:150px; left:50%; transform:translateX(-50%) translateY(20px); background:#fff; color:#111; padding:11px 18px; border-radius:12px; font-size:12.5px; opacity:0; transition:all .25s; z-index:50; white-space:nowrap; pointer-events:none; max-width:90%; font-weight:600;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  /* stats strip */
  .stats{display:flex; gap:8px; margin-bottom:12px;}
  .stat{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
  .stat .n{font-size:18px; font-weight:800; color:var(--ink);}
  .stat .n.red{color:var(--red);}
  .stat .l{font-size:9.5px; color:var(--muted); font-weight:600; margin-top:1px;}
  .doc-link{color:var(--accent); font-weight:600; text-decoration:underline; cursor:pointer;}
  .steps{display:flex; align-items:center; gap:4px; margin-bottom:12px;}
  .step{flex:1; text-align:center; font-size:9.5px; font-weight:700; color:var(--muted); padding:7px 2px; background:var(--panel); border:1px solid var(--line); border-radius:9px;}
  .step.done{background:var(--green-soft); color:var(--green); border-color:transparent;}
  .step.now{background:var(--accent); color:#fff; border-color:transparent;}
  .arrow{color:var(--muted); font-size:10px;}
  /* menu sheet */
  .sheet-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:40; display:flex; align-items:flex-end;}
  .sheet{background:var(--panel2); width:100%; border-radius:20px 20px 0 0; padding:10px 16px 22px; border-top:1px solid var(--line);}
  .sheet .handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:4px auto 14px;}
  .sheet-item{display:flex; align-items:center; gap:12px; padding:13px 4px; cursor:pointer; border-bottom:1px solid var(--line);}
  .sheet-item:last-child{border-bottom:none;}
  .sheet-item .icbox{background:var(--chip);}
  .badge-role{display:inline-block; padding:2px 8px; border-radius:20px; font-size:9.5px; font-weight:700; background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:middle;}
</style>
</head>
<body>
<div class="phone">
  <div class="mast"><b>ТРЁШКА</b><span>склад</span></div>
  <div class="hdr">
    <button class="back" id="backBtn" onclick="goBack()">←</button>
    <h1 id="hdrTitle">Склад<div class="sub" id="hdrSub"></div></h1>
    <button class="plus" id="plusBtn" style="display:none" onclick="openPlusMenu()">＋</button>
  </div>
  <div class="content" id="content"></div>
  <button class="fab" onclick="scanDemo()" title="Сканировать QR">▣</button>
  <div class="nav" id="nav">
    <button data-tab="sklad" class="on" onclick="go('sklad')"><span class="ic">📦</span>Склад</button>
    <button data-tab="posts" onclick="go('posts')"><span class="ic">🛠</span>Посты</button>
    <button data-tab="docs" onclick="go('docs')"><span class="ic">📄</span>Документы</button>
    <button data-tab="ext" onclick="go('ext')"><span class="ic">🚚</span>Выдачи</button>
    <button data-tab="more" onclick="go('more')"><span class="ic">⋯</span>Ещё</button>
  </div>
  <div class="toast" id="toast"></div>
  <div id="sheetLayer"></div>
</div>

function render(view, push=true){
  if(push && current) stack.push(current);

}

  const prev = stack.pop();

}

function csvDownload(filename, rows){
  const csv = '﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);}, 300);
  toast('⤓ Файл '+filename+' скачан');
}

  </body></html>`);
  w.document.close();
}

function itemsIn(topCat, subCat){
  return items.filter(i=> i.topCat===topCat && (subCat===undefined ? true : i.subCat===subCat));
}
function catStats(topCat, subCat){
  const list=itemsIn(topCat, subCat);
  return {count:list.length, low:list.filter(i=>i.stock<i.min).length};
}

function renderSkladList(topCat, subCat){
  const title = subCat || topCat;
  setHdr(title, subCat?`Комплектующие → ${subCat}`:'Раздел склада', true, currentRole!=='rabotnik');
  let list = itemsIn(topCat, subCat);
  if(filterABC!=='Все') list=list.filter(i=>i.abc===filterABC);
  if(filterLow) list=list.filter(i=>i.stock<i.min);
  if(sortMode==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  if(sortMode==='qty') list.sort((a,b)=>a.stock-b.stock);
  if(sortMode==='qtyd') list.sort((a,b)=>b.stock-a.stock);
  $('content').innerHTML = `
    <div class="filters" style="margin-bottom:10px">
      <button class="fbtn" onclick="skladPath=${subCat?"['Комплектующие']":'[]'}; filterABC='Все'; filterLow=false; views.sklad()">← ${subCat?'Комплектующие':'Все разделы'}</button>
    </div>
    <div class="toolbar">
      <input class="search" placeholder="🔍 Поиск в разделе «${title}»…" value="${searchQ}"
        oninput="searchQ=this.value; views.sklad(); this.focus(); this.setSelectionRange(this.value.length,this.value.length)">
      <select class="sort" onchange="sortMode=this.value; views.sklad()">
        <option value="name" ${sortMode==='name'?'selected':''}>По названию</option>
        <option value="qty" ${sortMode==='qty'?'selected':''}>Остаток ↑</option>
        <option value="qtyd" ${sortMode==='qtyd'?'selected':''}>Остаток ↓</option>
      </select>
    </div>
    <div class="filters">
      <button class="fbtn ${filterLow?'on':''}" onclick="filterLow=!filterLow; views.sklad()">⚠ Ниже минимума</button>
      ${['A','B','C'].map(a=>`<button class="fbtn ${filterABC===a?'on':''}" title="${ABC_INFO[a]}" onclick="filterABC=filterABC==='${a}'?'Все':'${a}'; views.sklad()">Группа ${a}</button>`).join('')}
    </div>
    ${renderItemCards(list)}
  `;
}

/* ================= ПЕРЕДАЧА ТОВАРА (реальный движок остатков) ================= */
function transferToPost(i, postName, qty){
  qty = Math.min(qty, i.stock);
  if(qty<=0) return 0;
  i.stock -= qty;
  i.posts[postName] = (i.posts[postName]||0) + qty;
  i.history.push({d:'21.07.2026', type:'out', text:`Выдано на пост ${postName}`, q:`−${qty} ${i.unit}`});
  const p = posts.find(p=>p.name===postName);
  if(p){
    const existing = p.stock.find(s=>s.id===i.id);
    if(existing) existing.q += qty; else p.stock.push({id:i.id, q:qty});
  }
  return qty;
}
function transferToSklad(i, postName, qty){
  const have = i.posts[postName]||0;
  qty = Math.min(qty, have);
  if(qty<=0) return 0;
  i.posts[postName] = have - qty;
  if(!i.posts[postName]) delete i.posts[postName];
  i.stock += qty;
  i.history.push({d:'21.07.2026', type:'in', text:`Возврат с поста ${postName} на склад`, q:`+${qty} ${i.unit}`});
  const p = posts.find(p=>p.name===postName);
  if(p){
    const existing = p.stock.find(s=>s.id===i.id);
    if(existing){ existing.q -= qty; if(existing.q<=0) p.stock=p.stock.filter(s=>s.id!==i.id); }
  }
  return qty;
}

  const i=item(itemId);
  const post=$('qt_post').value;
  const qty=parseFloat($('qt_qty').value);
  if(!post){ toast('Выберите пост'); return; }

    transferToPost(i, post, qty);

    toast(`✓ Выдано ${qty} ${i.unit} на пост ${post}`);

    const have=i.posts[post]||0;
    if(qty>have){ toast('На посту всего '+have+' '+i.unit); return; }
    transferToSklad(i, post, qty);
    logAction('Возврат на склад', `${i.name}: ${qty} ${i.unit} с поста ${post}`, post, itemId);
    toast(`✓ Возвращено ${qty} ${i.unit} на склад`);

      </select>

      const avail = mode==='post' ? i.stock : (i.posts[issueDest]||0);
      return `

    </div>`:''}

function toggleIssueItem(id, mode, avail){
  if(issueSelected[id]!=null){ delete issueSelected[id]; }
  else {
    if(avail<=0){ toast('Нет остатка для выдачи'); return; }
    issueSelected[id] = Math.min(1, avail);
  }
  views[mode==='post'?'issueToPost':'issueToSklad']();
}
function setIssueQty(id, val, avail){
  let v=parseFloat(val);
  if(isNaN(v)||v<0) v=0;
  if(v>avail) v=avail;
  issueSelected[id]=v;
}
function commitIssue(mode){
  const ids = Object.keys(issueSelected).filter(id=>issueSelected[id]>0);
  if(!ids.length){ toast('Укажите количество хотя бы для одной позиции'); return; }
  if(!issueDest){ toast('Выберите пост'); return; }
  const names=[];
  ids.forEach(id=>{
    const i=item(id); const q=issueSelected[id];
    if(mode==='post') transferToPost(i, issueDest, q); else transferToSklad(i, issueDest, q);
    names.push(`${i.name} (${q} ${i.unit})`);
  });
  logAction(mode==='post'?'Выдача на пост':'Возврат на склад', `${issueDest}: ${names.join(', ')}`, issueDest);
  toast(mode==='post' ? `✓ Выдано на пост «${issueDest}»` : `✓ Возвращено на склад с поста «${issueDest}»`);
  issueSelected={};
  setTimeout(()=>go('ext'), 700);
}

/* ================= ВЫДАЧА НА СТОРОНУ (реальное создание/возврат) ================= */
let extDraftLines=[];
function addExtLine(){
  const id=$('ei_item').value, q=parseFloat($('ei_qty').value);
  if(!q||q<=0){ toast('Укажите количество'); return; }
  const i=item(id);
  const already = extDraftLines.filter(l=>l.id===id).reduce((s,l)=>s+l.q,0);
  const remaining = i.stock - already;
  if(q>remaining){ toast('Недостаточно на складе: доступно ещё '+remaining+' '+i.unit); return; }
  const existing = extDraftLines.find(l=>l.id===id);
  if(existing) existing.q += q; else extDraftLines.push({id,q});
  $('ei_list').innerHTML = extDraftLines.map((l,n)=>{const it=item(l.id); return `<div class="mat"><div class="grow"><div class="t">${it.icon} ${it.name}</div></div><div class="q">${l.q} ${it.unit}</div></div>`;}).join('');
  toast('Позиция добавлена в выдачу');
}
function submitExtIssue(){
  const to=$('ei_to').value.trim();
  if(!to){ toast('Укажите получателя'); return; }
  if(!extDraftLines.length){ toast('Добавьте хотя бы одну позицию'); return; }
  const finalLines=[];
  extDraftLines.forEach(l=>{
    const i=item(l.id);
    const q=Math.min(l.q, i.stock);
    if(q<=0) return;
    i.stock -= q; i.ext += q;
    i.history.push({d:'21.07.2026', type:'out', text:`Выдача на сторону · ${to}`, q:`−${q} ${i.unit}`});
    finalLines.push({id:l.id, q});
  });
  if(!finalLines.length){ toast('Недостаточно остатков для выдачи'); return; }
  const no='ВН-0'+(20+extIssues.length);
  extIssues.unshift({no, to, date:'21.07.2026', status:'Выдано', due:$('ei_due').value||'—', items:finalLines, note:$('ei_note').value||''});
  logAction('Выдача на сторону оформлена', `${no}: ${to}`);
  toast('✓ Выдача '+no+' оформлена');
  extDraftLines=[];
  setTimeout(()=>go('ext'), 600);
}
function returnExtIssue(idx){
  const e=extIssues[idx];
  e.items.forEach(l=>{
    const i=item(l.id);
    i.stock += l.q; i.ext = Math.max(0, i.ext-l.q);
    i.history.push({d:'21.07.2026', type:'in', text:`Возврат по выдаче ${e.no} · ${e.to}`, q:`+${l.q} ${i.unit}`});
  });
  e.status='Возвращено';
  logAction('Возврат выдачи на сторону', `${e.no}: ${e.to}`);
  toast('✓ Возврат по '+e.no+' оформлен, остатки восстановлены');
  setTimeout(()=>go('ext'), 600);
}

  const [mm,yy]=exp.split('.').map(Number);
  const months=(yy-2026)*12+(mm-7);

function addMat(no){
  const id=$('addSel').value, q=parseFloat($('addQty').value);
  if(!q||q<=0){ toast('Укажите количество'); return; }
  const d=docs.find(x=>x.no===no);
  const existing=d.materials.find(m=>m.id===id);
  if(existing) existing.q += q; else d.materials.push({id,q});
  toast('Материал добавлен в акт');
  renderWorkDoc(d);
}
function removeMat(no, index){
  const d=docs.find(x=>x.no===no);
  d.materials.splice(index,1);
  toast('Позиция убрана из акта');
  renderWorkDoc(d);
}

function closeWork(no){
  const d=docs.find(x=>x.no===no);
  if(d.status==='Расхождение'){ toast('Сначала укажите причину расхождения и решение выше'); return; }
  performWorkClose(d);
}
function resolveMismatch(no){
  if(currentRole!=='admin'){ toast('🔒 Закрыть акт с расхождением может только администратор'); return; }
  const d=docs.find(x=>x.no===no);
  const reason=$('mm_reason').value.trim();
  const decision=$('mm_decision').value;
  if(!reason||!decision){ toast('Заполните причину и решение'); return; }
  d.mismatchReason=reason; d.mismatchDecision=decision;
  if(decision==='rework'){
    d.status='Черновик';
    logAction('Акт возвращён на доработку', `${d.no}: ${reason}`, d.post);
    toast('↩ Акт возвращён на доработку');
    setTimeout(()=>go('docs'), 800);
  } else {
    performWorkClose(d, 'расхождение принято администратором — '+reason);
  }
}
function performWorkClose(d, note){
  d.status='Закрыт';
  d.materials.forEach(m=>{
    const it=item(m.id);
    const postQ=it.posts[d.post]||0;
    it.posts[d.post]=Math.max(0,postQ-m.q);
    if(!it.posts[d.post]) delete it.posts[d.post];
    it.history.push({d:'21.07.2026', type:'off', text:`Списано по ${d.no} (${d.item.toLowerCase()})`, q:`−${m.q} ${it.unit}`});
  });
  const p=posts.find(p=>p.name===d.post);
  if(p){ p.repairs=p.repairs.filter(r=>r.serial!==d.serial);
    d.materials.forEach(m=>{ p.stock=p.stock.map(s=>s.id===m.id?{...s,q:Math.max(0,s.q-m.q)}:s).filter(s=>s.q>0); });
  }
  const ant=item('ant'); if(ant && d.serial==='000966'){ ant.stock+=1; ant.posts={}; ant.history.push({d:'21.07.2026', type:'in', text:`№${d.serial} возвращена на склад после ремонта (${d.no})`, q:'+1 шт'}); }
  logAction('Акт выполненных работ закрыт', `${d.no}: ${d.item}, списано ${d.materials.length} позиций материалов${note?' · '+note:''}`, d.post);
  toast('✓ Акт закрыт: материалы списаны');
  setTimeout(()=>go('docs'), 900);
}

  $('defSubmit').disabled = !ok;

  else { note.classList.remove('ok'); note.textContent='⚠ Черновик — акт работ будет доступен после заполнения всех полей и закрытия дефектовки'; }
}

function extractSerial(text){
  if(!text) return '000967';
  const afterMark = text.match(/№\s*(\d+)/);
  if(afterMark) return afterMark[1];
  const nums = text.match(/\d+/g);
  if(!nums || !nums.length) return '000967';
  return nums.reduce((a,b)=>b.length>a.length?b:a);
}

function startCycleCount(){
  cycleCount = {counts:{}};
  logAction('Инвентаризация начата', 'Полный пересчёт основного склада');
  render({fn:views.inventory}, false);
}
function setCount(id, val){
  const v = parseFloat(val);
  if(isNaN(v)){ delete cycleCount.counts[id]; return; }
  if(v<0){ toast('Остаток не может быть отрицательным'); delete cycleCount.counts[id]; return; }
  cycleCount.counts[id] = v;
}
function finishCycleCount(){
  const diffs = items.map(i=>{
    const counted = cycleCount.counts[i.id];
    if(counted===undefined) return null;
    const delta = counted - i.stock;
    return delta!==0 ? {i, counted, delta} : null;
  }).filter(Boolean);
  diffs.forEach(({i,counted,delta})=>{
    i.history.push({d:'21.07.2026', type: delta>0?'in':'off', text:'Корректировка по инвентаризации', q:`${delta>0?'+':''}${delta} ${i.unit}`});
    i.stock = counted;
  });
  logAction('Инвентаризация завершена', diffs.length ? `Расхождений: ${diffs.length} позиций` : 'Расхождений не найдено, остатки подтверждены');
  cycleCount = null;
  toast(diffs.length ? `✓ Акт расхождений: ${diffs.length} позиций скорректировано` : '✓ Расхождений нет, остатки подтверждены');
  setTimeout(()=>go('sklad'), 1000);
}

function exportPostExcel(idx){
  const p=posts[idx];
  const rows=[['Пост',p.name],['Куратор',p.curator],[],['Товар','Артикул','Количество','Ед.']];
  p.stock.filter(s=>s.q>0).forEach(s=>{const it=item(s.id); rows.push([it.name,it.sku,s.q,it.unit]);});
  csvDownload(`post_${p.name.replace(/\s+/g,'_')}.csv`, rows);
  logAction('Экспорт акта по посту', p.name, p.name);
}
function exportDocsExcel(){
  const rows=[['№ акта','Тип','Статус','Дата','Изделие','Пост']];
  docs.forEach(d=>rows.push([d.no, d.kind==='defekt'?'Дефектовка':'Акт работ', d.status, d.date, d.item, d.post]));
  csvDownload('dokumenty_akty.csv', rows);
  logAction('Экспорт документов в Excel', `${docs.length} актов`);
}
function exportWorkActExcel(no){
  const d=docs.find(x=>x.no===no);
  const rows=[['Акт выполненных работ',d.no],['Дефектовка',d.defektDoc],['Пост',d.post],['Дата',d.date],[],
    ['Участник','Работа']];
  (d.participants||[]).forEach(p=>rows.push([p.worker,p.work]));
  rows.push([],['Материал','Артикул','Количество']);
  d.materials.forEach(m=>{const it=item(m.id); rows.push([it.name,it.sku,`${m.q} ${it.unit}`]);});
  csvDownload(`${no}.csv`, rows);
  logAction('Экспорт акта работ в Excel', no, d.post);
}
function exportInventoryExcel(){
  const rows=[['Артикул','Название','Учётный остаток','Ед.']];
  items.forEach(i=>rows.push([i.sku,i.name,i.stock,i.unit]));
  csvDownload('inventarizatsiya.csv', rows);
  logAction('Экспорт инвентаризации в Excel', `${items.length} позиций`);
}
