<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТРЁШКА склад</title>
<style>
  :root{
    --bg:#05070a; --panel:#1b1f27; --panel2:#12151b; --ink:#e8ebf0; --muted:#8a92a3;
    --accent:#4f8cff; --accent-soft:rgba(79,140,255,.16); --green:#34d399; --green-soft:rgba(52,211,153,.14);
    --red:#f87171; --red-soft:rgba(248,113,113,.14); --amber:#fbbf24; --amber-soft:rgba(251,191,36,.14);
    --line:#2a2f3a; --chip:#232733;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{height:100%;}
  body{background:#000; margin:0; padding:0; overflow:hidden;}
  /* Реальный полноэкранный контейнер приложения (Android WebView = весь экран,
     без декоративной рамки "телефона" — та имела смысл только для превью в браузере). */
  .phone{width:100%; max-width:100%; height:100vh; height:100dvh; background:var(--bg); border-radius:0; box-shadow:none; overflow:hidden; display:flex; flex-direction:column; position:relative; color:var(--ink);}
  /* masthead */
  .mast{background:var(--panel2); padding:8px 16px 6px; display:flex; align-items:baseline; gap:6px; border-bottom:1px solid var(--line);}
  .mast b{font-size:13px; font-weight:800; letter-spacing:.04em; color:var(--accent);}
  .mast span{font-size:11px; color:var(--muted);}
  /* header */
  .hdr{background:var(--panel2); padding:12px 16px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; z-index:5;}
  .hdr .back{width:34px;height:34px;border-radius:10px;background:var(--chip);border:none;font-size:17px;color:var(--ink);cursor:pointer;flex:none;display:none;}
  .hdr .back.show{display:block;}
  .hdr h1{font-size:17px; font-weight:700; color:var(--ink); flex:1; line-height:1.2;}
  .hdr .sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:1px;}
  .hdr .plus{width:34px;height:34px;border-radius:10px;background:var(--accent);border:none;font-size:19px;color:#fff;cursor:pointer;flex:none;}
  /* content */
  .content{flex:1; overflow-y:auto; padding:14px 14px 90px; background:var(--bg);}
  .content::-webkit-scrollbar{width:0;}
  /* bottom nav */
  .nav{position:absolute; bottom:0; left:0; right:0; background:var(--panel2); border-top:1px solid var(--line); display:flex; padding:8px 4px 14px; z-index:10;}
  .nav button{flex:1; background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px; padding:4px 0;}
  .nav button .ic{font-size:19px; line-height:1;}
  .nav button.on{color:var(--accent); font-weight:600;}
  .nav button.nav-locked{opacity:.35;}
  /* FAB */
  .fab{position:absolute; bottom:86px; right:16px; width:54px; height:54px; border-radius:17px; background:var(--accent); color:#fff; border:none; font-size:23px; cursor:pointer; box-shadow:0 8px 24px rgba(79,140,255,.4); z-index:9;}
  /* cards */
  .card{background:var(--panel); border-radius:15px; padding:13px; margin-bottom:9px; border:1px solid var(--line); cursor:pointer; transition:transform .08s;}
  .card:active{transform:scale(.985);}
  .card.static{cursor:default;}
  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1; min-width:0;}
  .t{font-size:14px; font-weight:600; color:var(--ink);}
  .s{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .qty{font-size:15px; font-weight:700; color:var(--ink); text-align:right; white-space:nowrap;}
  .qty small{font-size:10.5px; color:var(--muted); font-weight:500;}
  .qty.low{color:var(--red);}
  .chip{display:inline-block; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:600; background:var(--chip); color:var(--muted);}
  .chip.green{background:var(--green-soft); color:var(--green);}
  .chip.red{background:var(--red-soft); color:var(--red);}
  .chip.amber{background:var(--amber-soft); color:var(--amber);}
  .chip.blue{background:var(--accent-soft); color:var(--accent);}
  .icbox{width:40px;height:40px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
  /* toolbar */
  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .search{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px; color:var(--ink); outline:none;}
  .search::placeholder{color:var(--muted);}
  select.sort{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:0 8px; font-size:12px; color:var(--ink); outline:none; max-width:130px;}
  .filters{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .fbtn{border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:6px 12px; font-size:11px; color:var(--muted); cursor:pointer; font-weight:600;}
  .fbtn.on{background:var(--ink); color:#111; border-color:var(--ink);}
  /* section title */
  .sec{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 2px 8px;}
  .sec:first-child{margin-top:2px;}
  /* item detail */
  .detail-top{background:var(--panel); border-radius:16px; border:1px solid var(--line); padding:16px; margin-bottom:10px; display:flex; gap:14px;}
  .qr-wrap{text-align:center; flex:none;}
  .qr-wrap img{border-radius:8px; border:1px solid var(--line); padding:5px; background:#fff;}
  .qr-wrap .s{margin-top:4px; font-size:10px;}
  .kv{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}
  .kv .v{color:var(--ink); font-weight:600; text-align:right;}
  /* timeline */
  .tl{position:relative; padding-left:18px;}
  .tl::before{content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .tl-item{position:relative; padding:0 0 14px;}
  .tl-item::before{content:''; position:absolute; left:-17px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--line);}
  .tl-item.in::before{background:var(--green);}
  .tl-item.out::before{background:var(--amber);}
  .tl-item.off::before{background:var(--red);}
  .tl-item .t{font-size:13px;}
  /* buttons */
  .btn{display:block; width:100%; padding:13px; border-radius:13px; border:none; font-size:14px; font-weight:700; cursor:pointer; text-align:center; margin-top:10px;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.primary:disabled{background:#334; color:#889; cursor:not-allowed;}
  .btn.ghost{background:var(--panel); color:var(--accent); border:1.5px solid var(--accent);}
  .btn.green{background:var(--green); color:#06231a;}
  .btn.red{background:var(--red); color:#2a0a0a;}
  .btn.red:disabled{background:#3a2a2a; color:#775; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{margin-top:10px;}
  /* forms */
  .fld{margin-bottom:11px;}
  .fld label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .fld label .req{color:var(--red);}
  .fld input,.fld select,.fld textarea{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:11px 12px; font-size:13.5px; color:var(--ink); outline:none;}
  .fld input::placeholder,.fld textarea::placeholder{color:#5b6270;}
  .fld input:focus,.fld textarea:focus{border-color:var(--accent);}
  .fld textarea{resize:none; height:64px;}
  .fld .hint{font-size:10.5px; color:var(--muted); margin-top:3px;}
  .fld.err input,.fld.err select,.fld.err textarea{border-color:var(--red);}
  .progress-note{background:var(--amber-soft); border-radius:11px; padding:10px 12px; font-size:12px; color:var(--amber); margin-bottom:12px; font-weight:600;}
  .progress-note.ok{background:var(--green-soft); color:var(--green);}
  .progress-note.bad{background:var(--red-soft); color:var(--red);}
  .notice-danger{display:flex; align-items:center; gap:10px; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.35); border-radius:13px; padding:12px; margin-bottom:12px; cursor:pointer;}
  .notice-danger .icbox{width:30px;height:30px;font-weight:800;font-size:16px;flex:none;}
  .scan-screen{position:absolute; inset:0; background:#000; z-index:45; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:18px;}
  .scan-screen .x{position:absolute; top:18px; right:18px; background:none; border:none; color:#fff; font-size:26px; cursor:pointer;}
  .scan-frame{width:220px; height:220px; position:relative;}
  .scan-frame i{position:absolute; width:38px; height:38px; border-color:var(--accent); display:block;}
  .scan-frame i:nth-child(1){left:0;top:0;border-left:3px solid;border-top:3px solid;border-radius:8px 0 0 0;}
  .scan-frame i:nth-child(2){right:0;top:0;border-right:3px solid;border-top:3px solid;border-radius:0 8px 0 0;}
  .scan-frame i:nth-child(3){left:0;bottom:0;border-left:3px solid;border-bottom:3px solid;border-radius:0 0 0 8px;}
  .scan-frame i:nth-child(4){right:0;bottom:0;border-right:3px solid;border-bottom:3px solid;border-radius:0 0 8px 0;}
  .scan-screen h2{color:#fff;font-size:15px;}
  .scan-screen p{color:var(--muted);font-size:12px;}
  .qty-picker{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .qty-picker select{flex:1;}
  .qty-picker input{width:80px;}
  .sel-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;}
  .sel-check.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .issue-bar{position:sticky; bottom:0; background:var(--panel2); border:1px solid var(--accent); border-radius:14px; margin-top:12px; padding:12px; display:flex; justify-content:space-between; align-items:center;}
  .issue-bar b{font-size:16px;color:var(--accent);margin-right:4px;}
  /* materials table */
  .mat{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .mat:last-child{border-bottom:none;}
  .mat .grow .t{font-size:13px;}
  .mat .q{font-weight:700; color:var(--ink); white-space:nowrap;}
  .mat .del{background:var(--red-soft); color:var(--red); border:none; width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:13px;}
  .addmat{display:flex; gap:6px; margin-top:10px;}
  .addmat select{flex:1;}
  .addmat input{width:70px;}
  .addmat button{background:var(--accent-soft); color:var(--accent); border:none; border-radius:11px; padding:0 14px; font-weight:700; cursor:pointer; font-size:18px;}
  /* toast */
  .toast{position:absolute; bottom:150px; left:50%; transform:translateX(-50%) translateY(20px); background:#fff; color:#111; padding:11px 18px; border-radius:12px; font-size:12.5px; opacity:0; transition:all .25s; z-index:50; white-space:nowrap; pointer-events:none; max-width:90%; font-weight:600;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  /* stats strip */
  .stats{display:flex; gap:8px; margin-bottom:12px;}
  .stat{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
  .stat .n{font-size:18px; font-weight:800; color:var(--ink);}
  .stat .n.red{color:var(--red);}
  .stat .l{font-size:9.5px; color:var(--muted); font-weight:600; margin-top:1px;}
  .doc-link{color:var(--accent); font-weight:600; text-decoration:underline; cursor:pointer;}
  .steps{display:flex; align-items:center; gap:4px; margin-bottom:12px;}
  .step{flex:1; text-align:center; font-size:9.5px; font-weight:700; color:var(--muted); padding:7px 2px; background:var(--panel); border:1px solid var(--line); border-radius:9px;}
  .step.done{background:var(--green-soft); color:var(--green); border-color:transparent;}
  .step.now{background:var(--accent); color:#fff; border-color:transparent;}
  .arrow{color:var(--muted); font-size:10px;}
  /* menu sheet */
  .sheet-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:40; display:flex; align-items:flex-end;}
  .sheet{background:var(--panel2); width:100%; border-radius:20px 20px 0 0; padding:10px 16px 22px; border-top:1px solid var(--line);}
  .sheet .handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:4px auto 14px;}
  .sheet-item{display:flex; align-items:center; gap:12px; padding:13px 4px; cursor:pointer; border-bottom:1px solid var(--line);}
  .sheet-item:last-child{border-bottom:none;}
  .sheet-item .icbox{background:var(--chip);}
  .badge-role{display:inline-block; padding:2px 8px; border-radius:20px; font-size:9.5px; font-weight:700; background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:middle;}
</style>
</head>
<body>
<div class="phone">
  <div class="mast"><b>ТРЁШКА</b><span>склад</span></div>
  <div class="hdr">
    <button class="back" id="backBtn" onclick="goBack()">←</button>
    <h1 id="hdrTitle">Склад<div class="sub" id="hdrSub"></div></h1>
    <button class="plus" id="plusBtn" style="display:none" onclick="openPlusMenu()">＋</button>
  </div>
  <div class="content" id="content"></div>
  <button class="fab" onclick="startNativeScan('fab')" title="Сканировать QR">▣</button>
  <div class="nav" id="nav">
    <button data-tab="sklad" class="on" onclick="go('sklad')"><span class="ic">📦</span>Склад</button>
    <button data-tab="posts" onclick="go('posts')"><span class="ic">🛠</span>Посты</button>
    <button data-tab="docs" onclick="go('docs')"><span class="ic">📄</span>Документы</button>
    <button data-tab="ext" onclick="go('ext')"><span class="ic">🚚</span>Выдачи</button>
    <button data-tab="more" onclick="go('more')"><span class="ic">⋯</span>Ещё</button>
  </div>
  <div class="toast" id="toast"></div>
  <div id="sheetLayer"></div>
</div>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);

        var b2 = read();
        var b3 = read();

      var bytes = [];

        if (c < 128) {
          bytes.push(c);

// QR-код кодирует НЕИЗМЕНЯЕМЫЙ id карточки, а не артикул (SKU) — так печатная
// этикетка остаётся рабочей после переименования товара или редактирования SKU.
const QR_CACHE = {};
function qrValue(i){ return `SKLAD-ITEM:${esc(i.id)}`; }
function genQR(id){
  if(!id) return null;
  if(QR_CACHE[id]) return QR_CACHE[id];
  try{
    const qr = qrcode(0, 'M');
    qr.addData('SKLAD-ITEM:'+id);
    qr.make();
    const url = qr.createDataURL(6, 0);
    QR_CACHE[id] = url;
    return url;
  }catch(e){
    return null;
  }
}
function drawQR(container, i){
  const src = genQR(i.id);
  container.innerHTML = src
    ? `<img src="${src}" width="110" height="110" alt="QR ${esc(i.sku)}">`
    : '<div class="s" style="padding:20px;color:var(--red)">QR не найден</div>';
}

function todayStr(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()}`;
}
function nowTimeStr(){
  const d = new Date();
  return `${todayStr()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function logAction(action, detail, post, itemId){

}

/* ================= ЛОКАЛЬНОЕ СОХРАНЕНИЕ СОСТОЯНИЯ (P0, требование "не терять данные") =================
   Это клиентский слой персистентности. Итоговая архитектура (см. "Твои требования"):
   сервер — источник правды, на Android — офлайн-БД с последующей синхронизацией.
   Здесь: сериализация всего состояния склада + версионирование схемы + миграции +
   автосохранение через нативный мост window.AndroidStorage (реализация — на стороне
   Android, см. MainActivity.kt/AppStateStore.kt: SQLite, транзакционная запись,
   резервная копия предыдущей версии перед перезаписью).
   Если мост недоступен (предпросмотр в обычном браузере вне приложения) —
   используется localStorage, но ТОЛЬКО как временная заглушка прототипа,
   а не как финальное хранилище складского учёта. */
const APP_SCHEMA_VERSION = 1;
const STORAGE_FALLBACK_KEY = 'treshka_sklad_state_v1';

function nativeStorageBridge(){
  return (typeof window!=='undefined' && window.AndroidStorage && typeof window.AndroidStorage.saveState==='function')
    ? window.AndroidStorage : null;
}

function serializeAppState(){
  return {
    schemaVersion: APP_SCHEMA_VERSION,
    savedAt: nowTimeStr(),
    itemSeq, categoriesList, componentSubcats, currentRole, currentUserPost,
    items, posts, docs, extIssues, auditLog,
  };
}

// Миграции применяются последовательно от сохранённой версии схемы до текущей,
// каждая переводит объект строго на следующую версию. Ни одна миграция не должна
// удалять бизнес-данные — только дополнять недостающие поля значениями по умолчанию.
// Пример на будущее: STATE_MIGRATIONS[1] = function(s){ s.newField = s.newField ?? default; s.schemaVersion = 2; return s; };
const STATE_MIGRATIONS = {};

function migrateAppState(saved){
  let s = saved;
  let guard = 0;
  while(s.schemaVersion < APP_SCHEMA_VERSION && guard++ < 50){
    const step = STATE_MIGRATIONS[s.schemaVersion];
    if(!step) break; // миграции для этой версии нет — останавливаемся, не трогая данные дальше
    s = step(s);
  }
  return s;
}

function applyAppState(saved){
  if(!saved || typeof saved !== 'object') return false;
  try{
    const s = migrateAppState(saved);
    if(!Array.isArray(s.items) || !Array.isArray(s.docs) || !Array.isArray(s.posts)) return false;
    items.length = 0; items.push(...s.items);
    posts.length = 0; posts.push(...s.posts);
    docs.length = 0; docs.push(...s.docs);
    extIssues.length = 0; extIssues.push(...(s.extIssues||[]));
    auditLog.length = 0; auditLog.push(...(s.auditLog||[]));
    itemSeq = typeof s.itemSeq === 'number' ? s.itemSeq : itemSeq;
    if(Array.isArray(s.categoriesList) && s.categoriesList.length) categoriesList = s.categoriesList;
    if(Array.isArray(s.componentSubcats) && s.componentSubcats.length) componentSubcats = s.componentSubcats;
    if(s.currentRole && ROLES[s.currentRole]) currentRole = s.currentRole;
    if(s.currentUserPost) currentUserPost = s.currentUserPost;
    return true;
  }catch(e){
    console.error('applyAppState: сохранённые данные повреждены, in-memory демо-данные НЕ затёрты:', e);
    return false;
  }
}

let _lastSavedPayload = null;
function flushSave(){
  const payload = JSON.stringify(serializeAppState());
  if(payload === _lastSavedPayload) return; // ничего не изменилось — не пишем лишний раз
  const bridge = nativeStorageBridge();
  try{
    if(bridge){
      bridge.saveState(payload, APP_SCHEMA_VERSION);
    } else {
      localStorage.setItem(STORAGE_FALLBACK_KEY, payload);
    }
    _lastSavedPayload = payload;
  }catch(e){
    console.error('flushSave: ошибка сохранения, попробуем на следующем тике:', e);
  }
}
// Периодическое автосохранение — основной механизм: не зависит от того, вызван ли
// markDirty()/logAction() в каждой конкретной мутирующей функции, поэтому ни одно
// изменение не потеряется из-за забытого вызова где-то в коде.
let _autosaveTimer = setInterval(flushSave, 4000);
// Android вызывает это перед уходом приложения в фон (onPause), гарантируя сохранение
// последних изменений даже если процесс будет убит системой сразу после сворачивания.
window.__flushSaveBeforePause = flushSave;
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);

function loadAppStateOnStart(){
  const bridge = nativeStorageBridge();
  try{
    const raw = bridge ? bridge.loadState() : localStorage.getItem(STORAGE_FALLBACK_KEY);
    if(raw && raw!=='null' && raw!==''){
      const saved = JSON.parse(raw);
      const ok = applyAppState(saved);
      if(!ok) toast('⚠ Не удалось прочитать сохранённые данные склада — открыты демо-данные, ничего не сохраняйте до проверки администратором');
      return ok;
    }
    return false; // сохранённых данных нет (первый запуск) — используем демо-данные как исходные
  }catch(e){
    console.error('loadAppStateOnStart: ошибка чтения хранилища, демо-данные НЕ применялись поверх возможных сохранённых:', e);
    toast('⚠ Ошибка чтения локального хранилища склада');
    return false;
  }
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Полный снимок навигационного состояния (путь по складу, поиск, фильтры,
// сортировка выдач, фильтры журнала) — сохраняется в стеке при каждом
// переходе, чтобы кнопка "назад" восстанавливала именно то состояние,
// с которого пользователь ушёл вперёд, а не просто дёргала последнюю
// функцию рендера с уже изменившимися глобальными переменными.
function captureNavState(){
  return {
    skladPath: skladPath.slice(), searchQ, globalSearchQ, filterABC, filterLow, sortMode,
    issueSearchQ, issueSort, issueDest, issueSelected: {...issueSelected},
    auditPostFilter, auditItemFilter,
    docsSearchQ, postsSearchQ, extSearchQ,
  };
}
function restoreNavState(snap){
  if(!snap) return;
  skladPath = snap.skladPath.slice(); searchQ = snap.searchQ; globalSearchQ = snap.globalSearchQ;
  filterABC = snap.filterABC; filterLow = snap.filterLow; sortMode = snap.sortMode;
  issueSearchQ = snap.issueSearchQ; issueSort = snap.issueSort; issueDest = snap.issueDest; issueSelected = {...snap.issueSelected};
  auditPostFilter = snap.auditPostFilter; auditItemFilter = snap.auditItemFilter;
  docsSearchQ = snap.docsSearchQ||''; postsSearchQ = snap.postsSearchQ||''; extSearchQ = snap.extSearchQ||'';
}
function render(view, push=true){
  if(push && current){ current.snap = captureNavState(); stack.push(current); }
  current = view;
  view.fn();
  $('content').scrollTop = 0;
}
function goBack(){
  const prev = stack.pop();
  if(prev){ restoreNavState(prev.snap); current = prev; prev.fn(); }
}
/* Переход внутри дерева склада — обязательно через render(), чтобы каждый
   уровень (категория → подкатегория → …) реально попадал в стек навигации. */
function goSklad(path, resetSearch=true, resetFilters=false){
  // Мутация состояния должна происходить ВНУТРИ fn(), которая вызывается
  // после того как render() снимет снимок ещё-старого состояния — иначе
  // в стек попадёт уже новое (только что установленное) значение skladPath.
  render({fn(){
    skladPath = path;
    if(resetSearch) searchQ='';
    if(resetFilters){ filterABC='Все'; filterLow=false; }
    views.sklad();
  }});
}
function go(tab){
  if(tab==='ext' && currentRole==='rabotnik'){ toast('🔒 Выдачи недоступны для роли «Работник»'); return; }
  stack.length = 0;
  if(tab==='sklad'){ skladPath=[]; searchQ=''; globalSearchQ=''; filterABC='Все'; filterLow=false; }
  if(tab==='ext'){ issueSelected={}; issueDest=''; issueSearchQ=''; extSearchQ=''; }
  if(tab==='docs'){ docsSearchQ=''; }
  if(tab==='posts'){ postsSearchQ=''; }
  setTab(tab);
  render({fn:views[tab]}, false);
}
function updateNavForRole(){
  const extBtn = document.querySelector('.nav button[data-tab="ext"]');
  if(extBtn) extBtn.classList.toggle('nav-locked', currentRole==='rabotnik');
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'), 2600);
}
/* ================= РЕАЛЬНОЕ СКАНИРОВАНИЕ QR КАМЕРОЙ (пункт #8 ревью) =================
   Раньше кнопка сканирования всегда открывала один и тот же демо-товар независимо
   от реального QR. Теперь: если приложение запущено внутри Android-обёртки
   (window.AndroidScanner доступен — см. MainActivity.kt/QrScanActivity.kt),
   запускается настоящая нативная камера с распознаванием через ML Kit; результат
   приходит асинхронно в window.onNativeScanResult(rawValue). Формат содержимого QR:
   "SKLAD-ITEM:<id>" (см. qrValue()/genQR() — кодируется неизменяемый id карточки).
   Вне Android-обёртки (предпросмотр в обычном браузере) показывается прежний
   демо-экран — камеру браузера сознательно не используем, чтобы не давать
   иллюзию рабочего сканирования там, где реального моста нет. */
let _pendingScanTarget = null; // 'fab' | 'defekt' — куда вернуть результат сканирования

function startNativeScan(target){
  _pendingScanTarget = target;
  if(window.AndroidScanner && typeof window.AndroidScanner.requestScan === 'function'){
    const layer=$('sheetLayer');
    layer.innerHTML = `
      <div class="scan-screen">
        <button class="x" onclick="$('sheetLayer').innerHTML=''">×</button>
        <div class="scan-frame"><i></i><i></i><i></i><i></i></div>
        <h2>Открываю камеру…</h2>
        <p>Наведите камеру на QR-код карточки склада</p>
      </div>`;
    window.AndroidScanner.requestScan();
  } else {
    scanDemo();
  }
}
// Android вызывает это после успешного распознавания (см. MainActivity.kt: scanLauncher).
function onNativeScanResult(rawValue){
  $('sheetLayer').innerHTML='';
  const target = _pendingScanTarget; _pendingScanTarget = null;
  const m = /^SKLAD-ITEM:(.+)$/.exec(String(rawValue||''));
  const id = m ? m[1] : null;
  const it = id ? items.find(x=>x.id===id) : null;
  if(target==='defekt'){
    if(it){ if($('f_itemid')) $('f_itemid').value = it.id; if(typeof checkDefekt==='function') checkDefekt(); toast('📷 QR распознан: '+it.name); }
    else toast('⚠ QR-код не привязан к карточке склада');
  } else {
    if(it) openItem(it.id);
    else toast('⚠ QR-код не распознан как карточка склада');
  }
}
// Android вызывает это при отмене/ошибке сканирования (нет разрешения на камеру, закрыл экран и т.п.).
function onNativeScanError(msg){
  _pendingScanTarget = null;
  $('sheetLayer').innerHTML='';
  toast('⚠ '+(msg||'Сканирование не выполнено'));
}
window.onNativeScanResult = onNativeScanResult;
window.onNativeScanError = onNativeScanError;

// Демо-заглушка — используется ТОЛЬКО вне нативной Android-обёртки (предпросмотр в браузере).

function csvDownload(filename, rows){
  const csv = '﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);}, 300);
  toast('⤓ Файл '+filename+' скачан');
}
function printLabel(id){
  const i = items.find(x=>x.id===id);
  const src = genQR(id);
  const w = window.open('', '_blank', 'width=400,height=500');
  if(!w){ toast('Разрешите всплывающие окна для печати'); return; }
  const skuTxt = i ? esc(i.sku) : '';
  const nameTxt = i ? esc(i.name) : '';
  w.document.write(`<html><head><title>Этикетка ${skuTxt}</title><style>
    @page{ size:60mm 40mm; margin:4mm; }
    @media print{ .noprint{display:none;} }
    body{font-family:Arial,sans-serif;text-align:center;padding:24px;}
    img{width:180px;height:180px;} h2{font-size:14px;margin:10px 0 2px;word-break:break-word} p{font-size:12px;color:#555}
    .noprint{margin-top:16px;font-size:11px;color:#888}
  </style></head><body>
    <img src="${src||''}"><h2>${nameTxt}</h2><p>${skuTxt}</p>
    <div class="noprint">Предпросмотр печати — размер этикетки 60×40мм, поля 4мм</div>
    <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`);
  w.document.close();
}

function itemsIn(topCat, subCat){
  return items.filter(i=> i.topCat===topCat && (subCat===undefined ? true : i.subCat===subCat));
}
function catStats(topCat, subCat){
  const list=itemsIn(topCat, subCat);
  return {count:list.length, low:list.filter(i=>i.stock<i.min).length};
}

function renderSkladList(topCat, subCat){
  const title = subCat || topCat;
  setHdr(title, subCat?`Комплектующие → ${subCat}`:'Раздел склада', true, currentRole!=='rabotnik');
  let list = itemsIn(topCat, subCat);
  if(searchQ.trim()){ const q=searchQ.trim().toLowerCase(); list=list.filter(i=>(i.name+i.sku).toLowerCase().includes(q)); }
  if(filterABC!=='Все') list=list.filter(i=>i.abc===filterABC);
  if(filterLow) list=list.filter(i=>i.stock<i.min);
  if(sortMode==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  if(sortMode==='qty') list.sort((a,b)=>a.stock-b.stock);
  if(sortMode==='qtyd') list.sort((a,b)=>b.stock-a.stock);
  $('content').innerHTML = `
    <div class="filters" style="margin-bottom:10px">
      <button class="fbtn" onclick="goSklad(${subCat?"['Комплектующие']":'[]'}, true, true)">← ${subCat?'Комплектующие':'Все разделы'}</button>
    </div>
    <div class="toolbar">
      <input class="search" placeholder="🔍 Поиск в разделе «${title}»…" value="${searchQ}"
        oninput="searchQ=this.value; views.sklad(); this.focus(); this.setSelectionRange(this.value.length,this.value.length)">
      <select class="sort" onchange="sortMode=this.value; views.sklad()">
        <option value="name" ${sortMode==='name'?'selected':''}>По названию</option>
        <option value="qty" ${sortMode==='qty'?'selected':''}>Остаток ↑</option>
        <option value="qtyd" ${sortMode==='qtyd'?'selected':''}>Остаток ↓</option>
      </select>
    </div>
    <div class="filters">
      <button class="fbtn ${filterLow?'on':''}" onclick="filterLow=!filterLow; views.sklad()">⚠ Ниже минимума</button>
      ${['A','B','C'].map(a=>`<button class="fbtn ${filterABC===a?'on':''}" title="${ABC_INFO[a]}" onclick="filterABC=filterABC==='${a}'?'Все':'${a}'; views.sklad()">Группа ${a}</button>`).join('')}

function submitNewCategory(inComponents){
  if(!canManageCatalog()){ toast('🔒 Недоступно для роли «Работник»'); return; }
  const name = $('nc_name').value.trim();
  if(!name){ toast('Введите название категории'); return; }
  const icon = $('nc_icon').value.trim() || '📦';
  if(inComponents){
    if(!componentSubcats.includes(name)) componentSubcats.push(name);
    CAT_ICON[name]=icon;
    logAction('Создана подкатегория', `«${name}» в разделе Комплектующие`);
    skladPath=['Комплектующие'];
  } else {
    if(!categoriesList.includes(name)) categoriesList.push(name);
    CAT_ICON[name]=icon;
    logAction('Создана категория', `«${name}» — новый раздел склада`);
    skladPath=[];
  }
  toast('✓ Категория «'+name+'» создана');
  setTimeout(()=>go('sklad'), 500);
}

function onNewItemTopChange(){
  $('ni_sub_wrap').style.display = $('ni_top').value==='Комплектующие' ? 'block' : 'none';
}
function submitNewItem(){
  if(!canManageCatalog()){ toast('🔒 Недоступно для роли «Работник»'); return; }
  const name=$('ni_name').value.trim();
  if(!name){ toast('Введите название товара'); return; }
  const topCat=$('ni_top').value;
  const subCat = topCat==='Комплектующие' ? $('ni_sub').value : undefined;
  const stockVal=parseFloat($('ni_stock').value);
  if(stockVal<0){ toast('Начальный остаток не может быть отрицательным'); return; }
  const sku = $('ni_sku').value.trim() || null;
  if(sku && items.some(x=>x.sku===sku)){ toast('Артикул «'+sku+'» уже используется другим товаром'); return; }
  itemSeq++;
  const finalSku = sku || `НВ-${itemSeq}`;
  const stock = isNaN(stockVal)?0:stockVal;
  const unit = $('ni_unit').value.trim() || 'шт';
  const newItem = {id:'item'+itemSeq, icon:CAT_ICON[subCat||topCat]||'📦', name, sku:finalSku, topCat, unit,
    stock, min:parseFloat($('ni_min').value)||1, abc:'C',
    desc:$('ni_desc').value||'', posts:{}, ext:0,
    history:[{d:todayStr(), type:'in', text:'Создание карточки товара', q:`+${stock} ${unit}`}]};
  if(subCat) newItem.subCat=subCat;

/* ================= ПЕРЕДАЧА ТОВАРА (реальный движок остатков) ================= */
function adjustLots(i, delta, breakdown){
  if(!i.lots || !delta) return [];
  if(delta<0){
    let remaining = -delta;
    const consumed = [];
    for(const lot of i.lots){
      if(remaining<=0) break;
      const take = Math.min(lot.qty, remaining);
      if(take<=0) continue;
      lot.qty -= take;
      remaining -= take;
      consumed.push({lot:lot.lot, q:take, exp:lot.exp});
    }
    i.lots = i.lots.filter(l=>l.qty>0);
    return consumed;
  } else {
    if(breakdown && breakdown.length){
      breakdown.forEach(b=>{
        const lot = i.lots.find(l=>l.lot===b.lot);
        if(lot) lot.qty += b.q; else i.lots.push({lot:b.lot, qty:b.q, exp:b.exp||'—'});
      });
    } else if(i.lots.length){
      i.lots[i.lots.length-1].qty += delta;
    } else {
      i.lots.push({lot:'Возврат', qty:delta, exp:'—'});
    }
    return [];
  }
}
function transferToPost(i, postName, qty){
  qty = Math.min(qty, i.stock);
  if(qty<=0) return 0;
  i.stock -= qty;
  const consumed = adjustLots(i, -qty);
  i.posts[postName] = (i.posts[postName]||0) + qty;
  i.history.push({d:todayStr(), type:'out', text:`Выдано на пост ${postName}`, q:`−${qty} ${i.unit}`});
  const p = posts.find(p=>p.name===postName);
  if(p){
    const existing = p.stock.find(s=>s.id===i.id);
    if(existing){
      existing.q += qty;
      if(consumed.length){
        existing.lots = existing.lots||[];
        consumed.forEach(c=>{ const l=existing.lots.find(x=>x.lot===c.lot); if(l) l.q+=c.q; else existing.lots.push({...c}); });
      }
    } else {
      p.stock.push({id:i.id, q:qty, lots: consumed.length?consumed.map(c=>({...c})):undefined});
    }
  }
  return qty;
}
function transferToSklad(i, postName, qty){
  const have = i.posts[postName]||0;
  qty = Math.min(qty, have);
  if(qty<=0) return 0;
  i.posts[postName] = have - qty;
  if(!i.posts[postName]) delete i.posts[postName];
  i.stock += qty;
  const p = posts.find(p=>p.name===postName);
  let breakdown = null;
  if(p){
    const existing = p.stock.find(s=>s.id===i.id);
    if(existing){
      if(existing.lots && existing.lots.length){
        let remaining = qty;
        breakdown = [];
        for(const l of existing.lots){
          if(remaining<=0) break;
          const take = Math.min(l.q, remaining);
          if(take<=0) continue;
          l.q -= take; remaining -= take;
          breakdown.push({lot:l.lot, q:take, exp:l.exp});
        }
        existing.lots = existing.lots.filter(l=>l.q>0);
      }
      existing.q -= qty; if(existing.q<=0) p.stock=p.stock.filter(s=>s.id!==i.id);
    }
  }
  adjustLots(i, qty, breakdown);
  i.history.push({d:todayStr(), type:'in', text:`Возврат с поста ${postName} на склад`, q:`+${qty} ${i.unit}`});
  return qty;
}

        <option value="cat" ${issueSort==='cat'?'selected':''}>По категории</option>

      </select>
    </div>
    ${list.map(i=>{
      const sel = issueSelected[i.id]!=null;

            ${sel?`<div class="qty-picker" onclick="event.stopPropagation()"><input type="number" min="0" max="${avail}" value="${issueSelected[i.id]}" onchange="setIssueQty('${i.id}', this.value, ${avail})"><span class="s">${i.unit}</span></div>`:''}
          </div>
        </div>
      </div>`;}).join('') || '<div class="s" style="text-align:center;padding:30px">Ничего не найдено</div>'}
    ${selCount>0?`
    <div class="issue-bar">

    </div>`:''}
  `;

function toggleIssueItem(id, mode, avail){
  if(issueSelected[id]!=null){ delete issueSelected[id]; }
  else {
    if(avail<=0){ toast('Нет остатка для выдачи'); return; }
    issueSelected[id] = Math.min(1, avail);
  }
  views[mode==='post'?'issueToPost':'issueToSklad']();
}
function setIssueQty(id, val, avail){
  let v=parseFloat(val);
  if(isNaN(v)||v<0) v=0;
  if(v>avail) v=avail;
  issueSelected[id]=v;
}
function commitIssue(mode){
  if(currentRole==='rabotnik'){ toast('🔒 Выдачи недоступны для роли «Работник»'); return; }
  const ids = Object.keys(issueSelected).filter(id=>issueSelected[id]>0);
  if(!ids.length){ toast('Укажите количество хотя бы для одной позиции'); return; }
  if(!issueDest){ toast('Выберите пост'); return; }
  const names=[];
  ids.forEach(id=>{
    const i=item(id); const q=issueSelected[id];
    if(mode==='post') transferToPost(i, issueDest, q); else transferToSklad(i, issueDest, q);
    names.push(`${esc(i.name)} (${q} ${i.unit})`);
  });
  logAction(mode==='post'?'Выдача на пост':'Возврат на склад', `${issueDest}: ${names.join(', ')}`, issueDest);
  toast(mode==='post' ? `✓ Выдано на пост «${issueDest}»` : `✓ Возвращено на склад с поста «${issueDest}»`);
  issueSelected={};
  setTimeout(()=>go('ext'), 700);
}

/* ================= ВЫДАЧА НА СТОРОНУ (реальное создание/возврат) ================= */
let extDraftLines=[];
function addExtLine(){
  if(currentRole==='rabotnik'){ toast('🔒 Выдачи недоступны для роли «Работник»'); return; }
  const id=$('ei_item').value, q=parseFloat($('ei_qty').value);
  if(!q||q<=0){ toast('Укажите количество'); return; }
  const i=item(id);
  const already = extDraftLines.filter(l=>l.id===id).reduce((s,l)=>s+l.q,0);
  const remaining = i.stock - already;
  if(q>remaining){ toast('Недостаточно на складе: доступно ещё '+remaining+' '+i.unit); return; }
  const existing = extDraftLines.find(l=>l.id===id);
  if(existing) existing.q += q; else extDraftLines.push({id,q});
  $('ei_list').innerHTML = extDraftLines.map((l,n)=>{const it=item(l.id); return `<div class="mat"><div class="grow"><div class="t">${it.icon} ${esc(it.name)}</div></div><div class="q">${l.q} ${it.unit}</div></div>`;}).join('');
  toast('Позиция добавлена в выдачу');
}
function submitExtIssue(){
  if(currentRole==='rabotnik'){ toast('🔒 Выдачи недоступны для роли «Работник»'); return; }
  const to=$('ei_to').value.trim();
  if(!to){ toast('Укажите получателя'); return; }
  if(!extDraftLines.length){ toast('Добавьте хотя бы одну позицию'); return; }
  const finalLines=[];
  extDraftLines.forEach(l=>{
    const i=item(l.id);
    const q=Math.min(l.q, i.stock);
    if(q<=0) return;
    i.stock -= q; i.ext += q;
    adjustLots(i, -q);
    i.history.push({d:todayStr(), type:'out', text:`Выдача на сторону · ${to}`, q:`−${q} ${i.unit}`});
    finalLines.push({id:l.id, q});
  });
  if(!finalLines.length){ toast('Недостаточно остатков для выдачи'); return; }
  const no='ВН-0'+(20+extIssues.length);
  extIssues.unshift({no, to, date:todayStr(), status:'Выдано', due:$('ei_due').value||'—', items:finalLines, note:$('ei_note').value||''});
  logAction('Выдача на сторону оформлена', `${no}: ${to}`);
  toast('✓ Выдача '+no+' оформлена');
  extDraftLines=[];
  setTimeout(()=>go('ext'), 600);
}
function returnExtIssue(idx){
  if(currentRole==='rabotnik'){ toast('🔒 Выдачи недоступны для роли «Работник»'); return; }
  const e=extIssues[idx];
  if(e.status==='Возвращено'){ toast('Возврат по этой выдаче уже оформлен'); return; }
  e.items.forEach(l=>{
    const i=item(l.id);
    i.stock += l.q; i.ext = Math.max(0, i.ext-l.q);
    adjustLots(i, l.q);
    i.history.push({d:todayStr(), type:'in', text:`Возврат по выдаче ${e.no} · ${e.to}`, q:`+${l.q} ${i.unit}`});
  });
  e.status='Возвращено';
  logAction('Возврат выдачи на сторону', `${e.no}: ${e.to}`);
  toast('✓ Возврат по '+e.no+' оформлен, остатки восстановлены');
  setTimeout(()=>go('ext'), 600);
}

function isSoonExp(exp){
  const [mm,yy]=exp.split('.').map(Number);
  const now = new Date();
  const months=(yy-now.getFullYear())*12+(mm-(now.getMonth()+1));
  return months<=3;
}

function addMat(no){
  const id=$('addSel').value, q=parseFloat($('addQty').value);
  if(!q||q<=0){ toast('Укажите количество'); return; }
  const d=docs.find(x=>x.no===no);
  const it=item(id);
  const existing=d.materials.find(m=>m.id===id);
  const already=existing?existing.q:0;
  const avail=(it.posts[d.post]||0);
  if(already+q>avail){ toast('На посту доступно ещё только '+Math.max(0,avail-already)+' '+it.unit); return; }
  if(existing) existing.q += q; else d.materials.push({id,q});
  toast('Материал добавлен в акт');
  renderWorkDoc(d);
}
function removeMat(no, index){
  const d=docs.find(x=>x.no===no);
  d.materials.splice(index,1);
  toast('Позиция убрана из акта');
  renderWorkDoc(d);
}

function hasUnresolvedMismatch(d){
  return d.planQty!=null && d.factQty!=null && d.planQty!==d.factQty && d.mismatchDecision!=='accept';
}
function findMaterialShortfalls(d){
  return d.materials.map(m=>{
    const it=item(m.id);
    const avail = it.posts[d.post]||0;
    return avail<m.q ? {it, need:m.q, avail} : null;
  }).filter(Boolean);
}
function closeWork(no){
  const d=docs.find(x=>x.no===no);
  if(d.status==='Закрыт'){ toast('Акт уже закрыт'); return; }
  if(hasUnresolvedMismatch(d)){ toast('Сначала укажите причину расхождения и решение выше'); return; }
  const shortfalls = findMaterialShortfalls(d);
  if(shortfalls.length){
    const s0=shortfalls[0];
    toast(`Недостаточно на посту «${d.post}»: ${s0.it.name} — нужно ${s0.need}, есть ${s0.avail} ${s0.it.unit}`);
    return;
  }
  performWorkClose(d);
}
function resolveMismatch(no){
  if(currentRole!=='admin'){ toast('🔒 Закрыть акт с расхождением может только администратор'); return; }
  const d=docs.find(x=>x.no===no);
  if(d.status==='Закрыт'){ toast('Акт уже закрыт'); return; }
  const reason=$('mm_reason').value.trim();
  const decision=$('mm_decision').value;
  if(!reason||!decision){ toast('Заполните причину и решение'); return; }
  d.mismatchReason=reason; d.mismatchDecision=decision;
  if(decision==='rework'){
    d.status='Черновик';
    logAction('Акт возвращён на доработку', `${d.no}: ${reason}`, d.post);
    toast('↩ Акт возвращён на доработку — расхождение остаётся под контролем администратора');
    setTimeout(()=>go('docs'), 800);
  } else {
    const shortfalls = findMaterialShortfalls(d);
    if(shortfalls.length){
      const s0=shortfalls[0];
      toast(`Недостаточно на посту «${d.post}»: ${s0.it.name} — нужно ${s0.need}, есть ${s0.avail} ${s0.it.unit}`);
      return;
    }
    performWorkClose(d, 'расхождение принято администратором — '+reason);
  }
}
function performWorkClose(d, note){
  if(d.status==='Закрыт'){ toast('Акт уже закрыт'); return; }
  d.status='Закрыт';
  d.materials.forEach(m=>{
    const it=item(m.id);
    const postQ=it.posts[d.post]||0;
    it.posts[d.post]=Math.max(0,postQ-m.q);
    if(!it.posts[d.post]) delete it.posts[d.post];
    it.history.push({d:todayStr(), type:'off', text:`Списано по ${d.no} (${d.item.toLowerCase()})`, q:`−${m.q} ${it.unit}`});
  });
  const p=posts.find(p=>p.name===d.post);
  if(p){ p.repairs=p.repairs.filter(r=>r.serial!==d.serial);
    d.materials.forEach(m=>{ p.stock=p.stock.map(s=>s.id===m.id?{...s,q:Math.max(0,s.q-m.q)}:s).filter(s=>s.q>0); });
  }
  const repaired = d.itemId ? item(d.itemId) : null;
  if(repaired){
    repaired.stock += 1;
    adjustLots(repaired, 1);
    if(repaired.posts[d.post]){ repaired.posts[d.post]=Math.max(0,repaired.posts[d.post]-1); if(!repaired.posts[d.post]) delete repaired.posts[d.post]; }
    repaired.history.push({d:todayStr(), type:'in', text:`№${d.serial} возвращена на склад после ремонта (${d.no})`, q:'+1 шт'});
  }
  logAction('Акт выполненных работ закрыт', `${d.no}: ${d.item}, списано ${d.materials.length} позиций материалов${note?' · '+note:''}`, d.post);
  toast('✓ Акт закрыт: материалы списаны');
  setTimeout(()=>go('docs'), 900);
}

function checkDefekt(){
  const fieldsOk = ['f_order','f_serial','f_date','f_from','f_post','f_callsign','f_fault','f_defects','f_verdict'].every(id=>$(id).value.trim());
  const serialOk = !!extractSerial($('f_serial').value.trim());
  const ok = fieldsOk && serialOk;
  $('defSubmit').disabled = !ok;
  const note=$('defNote');
  if(ok){ note.classList.add('ok'); note.textContent='✓ Все обязательные поля заполнены — можно закрывать акт'; }
  else if(fieldsOk && !serialOk){ note.classList.remove('ok'); note.textContent='⚠ Не найден серийный номер в поле изделия — укажите номер (например, «АН-9 №000967»)'; }
  else { note.classList.remove('ok'); note.textContent='⚠ Черновик — акт работ будет доступен после заполнения всех полей и закрытия дефектовки'; }
}

function extractSerial(text){
  if(!text) return null;
  const afterMark = text.match(/№\s*(\d+)/);
  if(afterMark) return afterMark[1];
  const nums = text.match(/\d+/g);
  if(!nums || !nums.length) return null;
  return nums.reduce((a,b)=>b.length>a.length?b:a);
}
function stripSerialFromLabel(text, serial){
  if(!text) return '';
  let out = text;
  if(serial){
    const withMark = out.replace(new RegExp('№\\s*'+serial), '');
    out = withMark!==out ? withMark : out.replace(new RegExp('\\b'+serial+'\\b'), '');
  }
  return out.replace(/\s{2,}/g,' ').trim();
}

function submitDefekt(){
  const verdict=$('f_verdict').value;
  const rawSerialInput=$('f_serial').value.trim();
  const serial=extractSerial(rawSerialInput);
  if(!serial){ toast('Не найден серийный номер — укажите его в поле изделия'); return; }
  const itemLabel = stripSerialFromLabel(rawSerialInput, serial) || 'Изделие';
  const itemId = $('f_itemid') && $('f_itemid').value ? $('f_itemid').value : null;
  const newNo='ДФ-'+(100+docs.filter(d=>d.kind==='defekt').length);
  let postName = $('f_post').value;
  if(isRabotnikRestrictedToPost()) postName = currentUserPost;
  docs.unshift({no:newNo, kind:'defekt', status:'Закрыт', date:$('f_date').value,
    orderNo:$('f_order').value,
    serial:serial, item:itemLabel, itemId,
    from:$('f_from').value, callsign:$('f_callsign').value, post:postName,
    fault:$('f_fault').value, defects:$('f_defects').value.split('\n').filter(Boolean),
    verdict:verdict, workDoc:null});
  if(!verdict.includes('Не подлежит')){
    const p = posts.find(pp=>pp.name===postName);
    if(p) p.repairs.push({serial, item:itemLabel, status:'В ремонте', doc:newNo});
  }
  logAction('Акт дефектовки закрыт', `${newNo}: ${itemLabel||'изделие'}, заключение: ${verdict}`, postName);
  if(verdict.includes('Не подлежит')){
    toast('✓ Акт закрыт: изделие уходит в списание');
    setTimeout(()=>go('docs'), 900);
  } else {
    render({fn(){
      setHdr('Дефектовка закрыта', newNo, false, false);
      $('content').innerHTML = `
        <div class="progress-note ok">✓ Акт ${newNo} закрыт и сохранён</div>
        <div class="card static"><div class="s" style="font-size:13px;color:var(--ink)">Создать сейчас акт выполненных работ на основании этой дефектовки? Номер акта дефектовки подставится автоматически.</div></div>
        <button class="btn primary" onclick="createWorkFromDefekt('${newNo}')">＋ Создать акт выполненных работ</button>
        <button class="btn ghost" onclick="go('docs')">Позже, вернуться к документам</button>
      `;
    }}, false);
  }
}

function createWorkFromDefekt(defektNo){
  const d = docs.find(x=>x.no===defektNo);
  if(d.workDoc){ toast('Акт выполненных работ уже создан: '+d.workDoc); setTimeout(()=>openDoc(docs.indexOf(docs.find(x=>x.no===d.workDoc))), 300); return; }
  const newNo = 'АВР-'+(200+docs.filter(x=>x.kind==='work').length);
  docs.unshift({no:newNo, kind:'work', status:'Черновик', date:todayStr(), orderNo:d.orderNo,
    serial:d.serial, item:d.item, itemId:d.itemId, defektDoc:defektNo, post:d.post, planQty:null, factQty:null,
    participants:[], works:[], materials:[]});
  d.workDoc = newNo;
  toast('✓ Акт '+newNo+' создан, привязан к '+defektNo);
  setTimeout(()=>openDoc(docs.indexOf(docs.find(x=>x.no===newNo))), 400);
}

function setRole(role){
  currentRole = role;
  render({fn:views.roles}, false);
  updateNavForRole();
  toast('Роль: '+ROLES[role].label);
}

function startCycleCount(){
  cycleCount = {counts:{}};
  logAction('Инвентаризация начата', 'Полный пересчёт основного склада');
  render({fn:views.inventory}, false);
}
function setCount(id, val){
  const v = parseFloat(val);
  if(isNaN(v)){ delete cycleCount.counts[id]; return; }
  if(v<0){ toast('Остаток не может быть отрицательным'); delete cycleCount.counts[id]; return; }
  cycleCount.counts[id] = v;
}
function finishCycleCount(){
  const counted = Object.keys(cycleCount.counts).length;
  if(counted < items.length){ toast('Пересчитайте все позиции перед завершением: осталось '+(items.length-counted)); return; }
  const diffs = items.map(i=>{
    const counted = cycleCount.counts[i.id];
    if(counted===undefined) return null;
    const delta = counted - i.stock;
    return delta!==0 ? {i, counted, delta} : null;
  }).filter(Boolean);
  diffs.forEach(({i,counted,delta})=>{
    i.history.push({d:todayStr(), type: delta>0?'in':'off', text:'Корректировка по инвентаризации', q:`${delta>0?'+':''}${delta} ${i.unit}`});
    i.stock = counted;
    adjustLots(i, delta);
  });
  logAction('Инвентаризация завершена', diffs.length ? `Расхождений: ${diffs.length} позиций` : 'Расхождений не найдено, остатки подтверждены');
  cycleCount = null;
  toast(diffs.length ? `✓ Акт расхождений: ${diffs.length} позиций скорректировано` : '✓ Расхождений нет, остатки подтверждены');
  setTimeout(()=>go('sklad'), 1000);
}

/* ================= ЭКСПОРТ В EXCEL (реальный .xlsx через SheetJS) ================= */
// Значения, которые Excel/Sheets/LibreOffice могут ошибочно интерпретировать как формулу
// (начинаются с =, +, -, @, а также с табуляции/CR — известные варианты CSV/XLSX formula injection).
const XLSX_FORMULA_RE = /^[=+\-@\t\r]/;
function xlsxSafeCell(v){
  if(typeof v === 'string' && XLSX_FORMULA_RE.test(v)) return "'"+v; // экранируем ведущим апострофом — ячейка остаётся текстом
  return v;
}
function xlsxSafeRows(rows){ return rows.map(row=>row.map(xlsxSafeCell)); }
function buildWorkbook(sheets){
  const wb = XLSX.utils.book_new();
  sheets.forEach(sh=>{
    const ws = XLSX.utils.aoa_to_sheet(xlsxSafeRows(sh.rows));
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0,31));
  });
  return wb;
}
function xlsxDownload(filename, sheets){
  let ok = true, errMsg = '';
  try{
    const wb = buildWorkbook(sheets);
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    // Автоматическая проверка целостности сразу после генерации: файл должен читаться обратно
    // тем же SheetJS и содержать все ожидаемые листы — иначе пользователь получит битый файл незаметно.
    const reparsed = XLSX.read(wbout, {type:'array'});
    const expected = sheets.map(s=>s.name.slice(0,31));
    const missing = expected.filter(n=>!reparsed.SheetNames.includes(n));
    if(missing.length){ ok=false; errMsg = 'Отсутствуют листы: '+missing.join(', '); }
    if(ok){
      const blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
      setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);}, 300);
      toast('⤓ Файл '+filename+' скачан');
    }
  }catch(e){ ok=false; errMsg = e.message||String(e); }
  if(!ok){ toast('⚠ Ошибка генерации .xlsx: '+errMsg); console.error('xlsxDownload failed:', errMsg); }
  return ok;
}
function exportStockExcel(){
  const stockRows=[['Артикул','Название','Раздел','Подраздел','Остаток','Ед.','Мин.остаток','ABC']];
  items.forEach(i=>stockRows.push([i.sku,i.name,i.topCat,i.subCat||'',i.stock,i.unit,i.min,i.abc]));

  const postsRows=[['Пост','Куратор','Товар','Артикул','Количество','Ед.']];
  posts.forEach(p=>{
    p.stock.filter(s=>s.q>0).forEach(s=>{ const it=item(s.id); if(it) postsRows.push([p.name,p.curator||'',it.name,it.sku,s.q,it.unit]); });
  });

  const lotsRows=[['Артикул','Название','Партия','Количество','Годен до','Место']];
  items.forEach(i=>{
    (i.lots||[]).forEach(l=>lotsRows.push([i.sku,i.name,l.lot,l.qty,l.exp||'—','Склад']));
    posts.forEach(p=>{
      const s = p.stock.find(x=>x.id===i.id);
      (s&&s.lots||[]).forEach(l=>lotsRows.push([i.sku,i.name,l.lot,l.q,l.exp||'—','Пост '+p.name]));
    });
  });

  const docsRows=[['№ акта','Тип','Статус','Дата','Изделие','Пост']];
  docs.forEach(d=>docsRows.push([d.no, d.kind==='defekt'?'Дефектовка':'Акт работ', d.status, d.date, d.item, d.post]));

  const movementsRows=[['Дата/время','Пользователь','Действие','Детали','Пост','Карточка']];
  auditLog.forEach(a=>{ const it=a.item?item(a.item):null; movementsRows.push([a.t,a.user,a.action,a.detail,a.post||'',it?it.sku:'']); });

  xlsxDownload('sklad_ostatki.xlsx', [
    {name:'Остатки', rows:stockRows},
    {name:'Посты', rows:postsRows},
    {name:'Партии', rows:lotsRows},
    {name:'Документы', rows:docsRows},
    {name:'Движения', rows:movementsRows},
  ]);
  logAction('Экспорт остатков в Excel', `${items.length} позиций`);
}
function exportPostExcel(idx){
  const p=posts[idx];
  const infoRows=[['Пост',p.name],['Куратор',p.curator],[],['Товар','Артикул','Количество','Ед.']];
  p.stock.filter(s=>s.q>0).forEach(s=>{const it=item(s.id); if(it) infoRows.push([it.name,it.sku,s.q,it.unit]);});

  const lotsRows=[['Товар','Артикул','Партия','Количество','Годен до']];
  p.stock.filter(s=>s.q>0).forEach(s=>{
    const it=item(s.id); if(!it) return;
    (s.lots||[]).forEach(l=>lotsRows.push([it.name,it.sku,l.lot,l.q,l.exp||'—']));
  });

  xlsxDownload(`post_${p.name.replace(/\s+/g,'_')}.xlsx`, [
    {name:'Пост', rows:infoRows},
    {name:'Партии', rows:lotsRows},
  ]);
  logAction('Экспорт акта по посту', p.name, p.name);
}
function exportDocsExcel(){
  const rows=[['№ акта','Тип','Статус','Дата','Изделие','Пост']];
  docs.forEach(d=>rows.push([d.no, d.kind==='defekt'?'Дефектовка':'Акт работ', d.status, d.date, d.item, d.post]));
  xlsxDownload('dokumenty_akty.xlsx', [{name:'Документы', rows}]);
  logAction('Экспорт документов в Excel', `${docs.length} актов`);
}
function exportWorkActExcel(no){
  const d=docs.find(x=>x.no===no);
  const infoRows=[['Акт выполненных работ',d.no],['Дефектовка',d.defektDoc],['Пост',d.post],['Дата',d.date],[],
    ['Участник','Работа']];
  (d.participants||[]).forEach(p=>infoRows.push([p.worker,p.work]));

  const matRows=[['Материал','Артикул','Количество']];
  d.materials.forEach(m=>{const it=item(m.id); if(it) matRows.push([it.name,it.sku,`${m.q} ${it.unit}`]);});

  xlsxDownload(`${no}.xlsx`, [
    {name:'Акт', rows:infoRows},
    {name:'Материалы', rows:matRows},
  ]);
  logAction('Экспорт акта работ в Excel', no, d.post);
}
function exportInventoryExcel(){
  const rows=[['Артикул','Название','Учётный остаток','Ед.']];
  items.forEach(i=>rows.push([i.sku,i.name,i.stock,i.unit]));
  xlsxDownload('inventarizatsiya.xlsx', [{name:'Инвентаризация', rows}]);
  logAction('Экспорт инвентаризации в Excel', `${items.length} позиций`);
}
